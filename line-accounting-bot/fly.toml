# Fly.io 部署配置
# 使用方式：fly launch && fly deploy

app = "line-accounting-bot"
primary_region = "nrt"  # 東京（離台灣較近）

[build]
  dockerfile = "Dockerfile"

[env]
  FLASK_HOST = "0.0.0.0"
  FLASK_PORT = "8080"
  FLASK_DEBUG = "False"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
